spring:
  sql:
    init:
      mode: always
  datasource:
    url: ${EVENT_DB_URL:jdbc:postgresql://localhost:5435/eventId}
    username: ${EVENT_DB_USERNAME:eventId}
    password: ${EVENT_DB_PASSWORD:eventId}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 0

stats:
  client:
    type: feign

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    root: INFO
    ru.practicum.core.event: DEBUG
