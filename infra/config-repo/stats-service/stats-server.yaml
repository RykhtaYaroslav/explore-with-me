spring:
  sql:
    init:
      mode: always
  datasource:
    url: ${STATS_DB_URL:jdbc:postgresql://localhost:5433/stats}
    username: ${STATS_DB_USERNAME:stats}
    password: ${STATS_DB_PASSWORD:stats}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
