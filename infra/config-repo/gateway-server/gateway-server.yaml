spring:
  cloud:
    gateway:
      routes:
        - id: compilation
          uri: lb://compilation-service
          predicates:
            - Path=/compilations,/compilations/**,/admin/compilations,/admin/compilations/**

        - id: participation
          uri: lb://participation-service
          predicates:
            - Path=/users/*/requests,/users/*/requests/**,/users/*/events/*/requests

        - id: events
          uri: lb://event-service
          predicates:
            - Path=/events,/events/**,/admin/events,/admin/events/**,/categories,/categories/**,/admin/categories,/admin/categories/**,/users/*/events,/users/*/events/**

        - id: users
          uri: lb://user-service
          predicates:
            - Path=/admin/users,/admin/users/**

        - id: reviews
          uri: lb://review-service
          predicates:
            - Path=/reviews,/reviews/**,/rating,/rating/**,/test/time
server:
  port: 8080
