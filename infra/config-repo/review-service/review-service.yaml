spring:
  sql:
    init:
      mode: always
  datasource:
    url: ${REVIEW_DB_URL:jdbc:postgresql://localhost:5434/review}
    username: ${REVIEW_DB_USERNAME:review}
    password: ${REVIEW_DB_PASSWORD:review}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    root: INFO
    ru.practicum.core.review: DEBUG
