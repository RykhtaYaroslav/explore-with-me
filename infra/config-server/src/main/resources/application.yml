server:
  port: 0

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:./infra/config-repo
            - file:./infra/config-repo/stats-service
            - file:./infra/config-repo/event-service
            - file:./infra/config-repo/review-service
            - file:./infra/config-repo/user-service
            - file:./infra/config-repo/participation-service
            - file:./infra/config-repo/compilation-service
            - file:./infra/config-repo/gateway-server

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
