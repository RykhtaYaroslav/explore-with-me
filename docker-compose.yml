services:
  stats-db:
    image: postgres:16.1
    container_name: ewm-stats-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${STATS_DB_NAME:-stats}
      POSTGRES_USER: ${STATS_DB_USERNAME:-stats}
      POSTGRES_PASSWORD: ${STATS_DB_PASSWORD:-stats}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  review-db:
    image: postgres:16.1
    container_name: ewm-review-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${REVIEW_DB_NAME:-review}
      POSTGRES_USER: ${REVIEW_DB_USERNAME:-review}
      POSTGRES_PASSWORD: ${REVIEW_DB_PASSWORD:-review}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  event-db:
    image: postgres:16.1
    container_name: ewm-eventId-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ${EVENT_DB_NAME:-eventId}
      POSTGRES_USER: ${EVENT_DB_USERNAME:-eventId}
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD:-eventId}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16.1
    container_name: ewm-user-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-users}
      POSTGRES_USER: ${USER_DB_USERNAME:-users}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-users}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  participation-db:
    image: postgres:16.1
    container_name: ewm-participation-db
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: ${PARTICIPATION_DB_NAME:-participation}
      POSTGRES_USER: ${PARTICIPATION_DB_USERNAME:-participation}
      POSTGRES_PASSWORD: ${PARTICIPATION_DB_PASSWORD:-participation}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  compilation-db:
    image: postgres:16.1
    container_name: ewm-compilation-db
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: ${COMPILATION_DB_NAME:-compilation}
      POSTGRES_USER: ${COMPILATION_DB_USERNAME:-compilation}
      POSTGRES_PASSWORD: ${COMPILATION_DB_PASSWORD:-compilation}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  config-server:
    build: ./infra/config-server
    container_name: ewm-config-server
    volumes:
      - ./infra/config-repo:/config-repo:ro
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:/config-repo,file:/config-repo/stats-service,file:/config-repo/event-service,file:/config-repo/main-service,file:/config-repo/review-service,file:/config-repo/user-service,file:/config-repo/participation-service,file:/config-repo/compilation-service,file:/config-repo/gateway-server"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  discovery-server:
    build: ./infra/discovery-server
    container_name: ewm-discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  stats-server:
    build: ./stats/stats-server
    container_name: ewm-stats-server
    depends_on:
      stats-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/${STATS_DB_NAME:-stats}
      SPRING_DATASOURCE_USERNAME: ${STATS_DB_USERNAME:-stats}
      SPRING_DATASOURCE_PASSWORD: ${STATS_DB_PASSWORD:-stats}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/

  ewm-db:
    image: postgres:16.1
    container_name: ewm-main-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: main
      POSTGRES_PASSWORD: main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U main -d ewm"]
      interval: 5s
      timeout: 5s
      retries: 5

  ewm-service:
    build: ./core/main-service
    container_name: ewm-main-service
    depends_on:
      ewm-db:
        condition: service_healthy
      stats-server:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm
      SPRING_DATASOURCE_USERNAME: main
      SPRING_DATASOURCE_PASSWORD: main
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/

  gateway-server:
    build: ./infra/gateway-server
    container_name: ewm-gateway-server
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      stats-server:
        condition: service_started
      ewm-service:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
