x-eureka-healthcheck: &eureka-healthcheck
  test:
    - CMD-SHELL
    - "wget -qO- --header=Accept:application/json http://discovery-server:8761/eureka/apps/$${EUREKA_APP} | grep -q UP"
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 30s

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic stats.user-actions.v1 --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic stats.events-similarity.v1 --partitions 1 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy

  stats-db:
    image: postgres:16.1
    ports:
      - "127.0.0.1::5432"
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${STATS_DB_NAME:-stats}
      POSTGRES_USER: ${STATS_DB_USERNAME:-stats}
      POSTGRES_PASSWORD: ${STATS_DB_PASSWORD:-stats}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  analyzer-db:
    image: postgres:16.1
    ports:
      - "127.0.0.1::5432"
    volumes:
      - analyzer-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${ANALYZER_DB_NAME:-analyzer}
      POSTGRES_USER: ${ANALYZER_DB_USERNAME:-analyzer}
      POSTGRES_PASSWORD: ${ANALYZER_DB_PASSWORD:-analyzer}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: stats/collector/Dockerfile
    healthcheck: *eureka-healthcheck
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_APP: COLLECTOR
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  aggregator:
    build:
      context: .
      dockerfile: stats/aggregator/Dockerfile
    healthcheck: *eureka-healthcheck
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_APP: AGGREGATOR
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  analyzer:
    build:
      context: .
      dockerfile: stats/analyzer/Dockerfile
    healthcheck: *eureka-healthcheck
    depends_on:
      analyzer-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://analyzer-db:5432/${ANALYZER_DB_NAME:-analyzer}
      SPRING_DATASOURCE_USERNAME: ${ANALYZER_DB_USERNAME:-analyzer}
      SPRING_DATASOURCE_PASSWORD: ${ANALYZER_DB_PASSWORD:-analyzer}
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_APP: ANALYZER
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  review-db:
    image: postgres:16.1
    ports:
      - "127.0.0.1::5432"
    volumes:
      - review-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${REVIEW_DB_NAME:-review}
      POSTGRES_USER: ${REVIEW_DB_USERNAME:-review}
      POSTGRES_PASSWORD: ${REVIEW_DB_PASSWORD:-review}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  event-db:
    image: postgres:16.1
    ports:
      - "127.0.0.1::5432"
    volumes:
      - event-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${EVENT_DB_NAME:-eventId}
      POSTGRES_USER: ${EVENT_DB_USERNAME:-eventId}
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD:-eventId}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16.1
    ports:
      - "127.0.0.1::5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-users}
      POSTGRES_USER: ${USER_DB_USERNAME:-users}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-users}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  participation-db:
    image: postgres:16.1
    ports:
      - "127.0.0.1::5432"
    volumes:
      - participation-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PARTICIPATION_DB_NAME:-participation}
      POSTGRES_USER: ${PARTICIPATION_DB_USERNAME:-participation}
      POSTGRES_PASSWORD: ${PARTICIPATION_DB_PASSWORD:-participation}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  compilation-db:
    image: postgres:16.1
    ports:
      - "127.0.0.1::5432"
    volumes:
      - compilation-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${COMPILATION_DB_NAME:-compilation}
      POSTGRES_USER: ${COMPILATION_DB_USERNAME:-compilation}
      POSTGRES_PASSWORD: ${COMPILATION_DB_PASSWORD:-compilation}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  compilation-service:
    build:
      context: .
      dockerfile: core/compilation-service/Dockerfile
    healthcheck: *eureka-healthcheck
    depends_on:
      compilation-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://compilation-db:5432/${COMPILATION_DB_NAME:-compilation}
      SPRING_DATASOURCE_USERNAME: ${COMPILATION_DB_USERNAME:-compilation}
      SPRING_DATASOURCE_PASSWORD: ${COMPILATION_DB_PASSWORD:-compilation}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_APP: COMPILATION-SERVICE
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/

  event-service:
    build:
      context: .
      dockerfile: core/event-service/Dockerfile
    healthcheck: *eureka-healthcheck
    depends_on:
      event-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      stats-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/${EVENT_DB_NAME:-eventId}
      SPRING_DATASOURCE_USERNAME: ${EVENT_DB_USERNAME:-eventId}
      SPRING_DATASOURCE_PASSWORD: ${EVENT_DB_PASSWORD:-eventId}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_APP: EVENT-SERVICE
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/

  user-service:
    build:
      context: .
      dockerfile: core/user-service/Dockerfile
    healthcheck: *eureka-healthcheck
    depends_on:
      user-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/${USER_DB_NAME:-users}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USERNAME:-users}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:-users}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_APP: USER-SERVICE
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/

  review-service:
    build:
      context: .
      dockerfile: core/review-service/Dockerfile
    healthcheck: *eureka-healthcheck
    depends_on:
      review-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://review-db:5432/${REVIEW_DB_NAME:-review}
      SPRING_DATASOURCE_USERNAME: ${REVIEW_DB_USERNAME:-review}
      SPRING_DATASOURCE_PASSWORD: ${REVIEW_DB_PASSWORD:-review}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_PROFILES_ACTIVE: ${REVIEW_PROFILES_ACTIVE:-docker}
      EUREKA_APP: REVIEW-SERVICE
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/

  participation-service:
    build:
      context: .
      dockerfile: core/participation-service/Dockerfile
    healthcheck: *eureka-healthcheck
    depends_on:
      participation-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://participation-db:5432/${PARTICIPATION_DB_NAME:-participation}
      SPRING_DATASOURCE_USERNAME: ${PARTICIPATION_DB_USERNAME:-participation}
      SPRING_DATASOURCE_PASSWORD: ${PARTICIPATION_DB_PASSWORD:-participation}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_APP: PARTICIPATION-SERVICE
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    volumes:
      - ./infra/config-repo:/config-repo:ro
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck: *eureka-healthcheck
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_APP: CONFIG-SERVER
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:/config-repo,file:/config-repo/stats-service,file:/config-repo/event-service,file:/config-repo/review-service,file:/config-repo/user-service,file:/config-repo/participation-service,file:/config-repo/compilation-service,file:/config-repo/gateway-server,file:/config-repo/collector,file:/config-repo/aggregator,file:/config-repo/analyzer"

  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  stats-server:
    build:
      context: .
      dockerfile: stats/stats-server/Dockerfile
    healthcheck: *eureka-healthcheck
    depends_on:
      stats-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/${STATS_DB_NAME:-stats}
      SPRING_DATASOURCE_USERNAME: ${STATS_DB_USERNAME:-stats}
      SPRING_DATASOURCE_PASSWORD: ${STATS_DB_PASSWORD:-stats}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_APP: STATS-SERVER
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/

  gateway-server:
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      stats-server:
        condition: service_healthy
      compilation-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
      participation-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/

volumes:
  kafka-data:
  analyzer-db-data:
  stats-db-data:
  review-db-data:
  event-db-data:
  user-db-data:
  participation-db-data:
  compilation-db-data:
